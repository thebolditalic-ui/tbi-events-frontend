<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBI Events Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --cream: #fff6e6;
  --dark: #1E1B1B;
  --gold: #FFD682;
  --blue: #5b7bd5;
  --red: #e74c3c;
  --green: #27ae60;
  --border: #e0d8cc;
  --bg-alt: #faf5eb;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --title-font: 'Georgia', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--cream);
  color: var(--dark);
  min-height: 100vh;
}

/* ---- Login Screen ---- */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.login-box {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 40px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.login-box h1 {
  font-family: var(--title-font);
  font-size: 22px;
  margin-bottom: 6px;
}
.login-box p {
  color: #888;
  font-size: 13px;
  margin-bottom: 24px;
}
.login-box label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #666;
  margin-bottom: 4px;
}
.login-box input[type="email"],
.login-box input[type="password"] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  margin-bottom: 16px;
  background: var(--bg-alt);
}
.login-box input:focus {
  outline: none;
  border-color: var(--blue);
}
.btn {
  display: inline-block;
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn:hover { opacity: 0.85; }
.btn-primary {
  background: var(--dark);
  color: #fff;
  width: 100%;
}
.btn-gold {
  background: var(--gold);
  color: var(--dark);
}
.btn-danger {
  background: var(--red);
  color: #fff;
}
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--dark);
}
.btn-sm {
  padding: 6px 14px;
  font-size: 12px;
}
.login-error {
  color: var(--red);
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
}

/* ---- Admin Shell ---- */
#admin-app { display: none; }

.admin-header {
  background: var(--dark);
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.admin-header h1 {
  font-family: var(--title-font);
  font-size: 18px;
  font-weight: 400;
}
.admin-header .user-info {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: #ccc;
}

.admin-toolbar {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.admin-toolbar .search-box {
  flex: 1;
  min-width: 200px;
  max-width: 400px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  background: #fff;
}
.admin-toolbar .search-box:focus {
  outline: none;
  border-color: var(--blue);
}
.toolbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ---- Events Table ---- */
.table-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 40px;
}
.ev-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  font-size: 13px;
}
.ev-table th {
  background: var(--bg-alt);
  text-align: left;
  padding: 10px 12px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #888;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.ev-table th:hover { color: var(--dark); }
.ev-table td {
  padding: 10px 12px;
  border-bottom: 1px solid #f0ebe0;
  vertical-align: middle;
}
.ev-table tr:last-child td { border-bottom: none; }
.ev-table tr:hover td { background: var(--bg-alt); }

.ev-table .thumb-cell {
  width: 50px;
  padding: 6px;
}
.ev-table .thumb-cell img {
  width: 44px;
  height: 44px;
  object-fit: cover;
  border-radius: 4px;
  display: block;
}
.ev-table .title-cell {
  font-weight: 600;
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ev-table .pick-toggle {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--gold);
}
.ev-table .actions-cell {
  white-space: nowrap;
}
.ev-table .actions-cell button {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 8px;
  font-size: 13px;
  border-radius: 4px;
}
.ev-table .actions-cell .edit-btn:hover { background: #eee; }
.ev-table .actions-cell .del-btn { color: var(--red); }
.ev-table .actions-cell .del-btn:hover { background: #fde8e8; }

.table-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  font-size: 13px;
  color: #888;
}
.table-footer button {
  background: #fff;
  border: 1px solid var(--border);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
.table-footer button:disabled {
  opacity: 0.4;
  cursor: default;
}

.source-badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  background: #eee;
  color: #666;
}
.source-badge.manual {
  background: var(--gold);
  color: var(--dark);
}

/* ---- Modal / Form ---- */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 1000;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
  overflow-y: auto;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #fff;
  border-radius: 12px;
  width: 100%;
  max-width: 680px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  animation: slideUp 0.2s ease;
}
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}
.modal-head h2 {
  font-family: var(--title-font);
  font-size: 18px;
}
.modal-head .close-btn {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: #888;
  padding: 4px;
}
.modal-body {
  padding: 24px;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
.form-row.full { grid-template-columns: 1fr; }
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #666;
  margin-bottom: 4px;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  font-family: var(--font);
  background: var(--bg-alt);
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--blue);
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-check {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.form-check input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--gold);
}
.form-check label {
  font-size: 13px;
  font-weight: 500;
  text-transform: none;
  letter-spacing: 0;
  color: var(--dark);
}
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.modal-footer .left-actions { display: flex; gap: 10px; }
.status-msg {
  font-size: 13px;
  padding: 8px 12px;
  border-radius: 6px;
  margin-bottom: 16px;
  display: none;
}
.status-msg.success { display: block; background: #e8f8ef; color: var(--green); }
.status-msg.error { display: block; background: #fde8e8; color: var(--red); }

/* ---- Confirm Dialog ---- */
.confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1100;
  align-items: center;
  justify-content: center;
}
.confirm-overlay.active { display: flex; }
.confirm-box {
  background: #fff;
  border-radius: 12px;
  padding: 28px;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
.confirm-box p { margin-bottom: 20px; font-size: 15px; line-height: 1.5; }
.confirm-box .confirm-actions { display: flex; gap: 10px; justify-content: center; }

/* ---- Featured Manager ---- */
.feat-manager {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 24px;
}
.feat-manager h2 {
  font-family: var(--title-font);
  font-size: 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.feat-manager h2 .feat-star { color: var(--gold); }
.feat-slots {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.feat-slot {
  background: #fff;
  border: 2px dashed var(--border);
  border-radius: 10px;
  padding: 14px;
  min-height: 120px;
  position: relative;
  transition: border-color 0.15s;
}
.feat-slot.filled {
  border-style: solid;
  border-color: var(--gold);
}
.feat-slot-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #999;
  margin-bottom: 8px;
  font-weight: 600;
}
.feat-slot-content {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.feat-slot-img {
  width: 60px;
  height: 60px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
}
.feat-slot-info h4 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 2px;
  line-height: 1.3;
}
.feat-slot-info .feat-slot-source {
  font-size: 11px;
  color: #888;
}
.feat-slot-clear {
  position: absolute;
  top: 8px;
  right: 8px;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
  color: #ccc;
  line-height: 1;
}
.feat-slot-clear:hover { color: var(--red); }
.feat-slot-empty {
  color: #bbb;
  font-size: 13px;
  font-style: italic;
  padding-top: 16px;
  text-align: center;
}
.feat-candidates {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.feat-candidates-head {
  padding: 10px 14px;
  background: var(--bg-alt);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #888;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.feat-candidates-head button {
  font-size: 11px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 8px;
  cursor: pointer;
  color: #666;
}
.feat-candidates-head button:hover { background: #eee; }
.feat-cand-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid #f0ebe0;
  font-size: 13px;
}
.feat-cand-row:last-child { border-bottom: none; }
.feat-cand-row:hover { background: var(--bg-alt); }
.feat-cand-img {
  width: 40px;
  height: 40px;
  border-radius: 4px;
  object-fit: cover;
  flex-shrink: 0;
}
.feat-cand-info {
  flex: 1;
  min-width: 0;
}
.feat-cand-info h4 {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.feat-cand-info .feat-cand-meta {
  font-size: 11px;
  color: #888;
}
.feat-cand-actions {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.feat-cand-actions select {
  font-size: 11px;
  padding: 3px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
}
.feat-cand-actions button {
  font-size: 11px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  color: var(--red);
  white-space: nowrap;
}
.feat-cand-actions button:hover { background: #fde8e8; }
.feat-loading {
  padding: 24px;
  text-align: center;
  color: #999;
  font-size: 13px;
}

/* ---- Responsive ---- */
@media (max-width: 768px) {
  .admin-toolbar { flex-direction: column; align-items: stretch; }
  .admin-toolbar .search-box { max-width: 100%; }
  .form-row { grid-template-columns: 1fr; }
  .ev-table { font-size: 12px; }
  .ev-table .thumb-cell { display: none; }
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-box">
    <h1>TBI Events Admin</h1>
    <p>Sign in to manage events on The Bold Italic</p>
    <div id="login-error" class="login-error"></div>
    <label for="login-email">Email</label>
    <input type="email" id="login-email" placeholder="you@thebolditalic.com" autofocus>
    <label for="login-pass">Password</label>
    <input type="password" id="login-pass" placeholder="••••••••">
    <button class="btn btn-primary" id="login-btn">Sign In</button>
  </div>
</div>

<!-- ============ ADMIN APP ============ -->
<div id="admin-app">
  <header class="admin-header">
    <h1>TBI Events Admin</h1>
    <div class="user-info">
      <span id="user-email"></span>
      <button class="btn btn-outline btn-sm" id="logout-btn">Sign Out</button>
    </div>
  </header>

  <div class="admin-toolbar">
    <input type="text" class="search-box" id="search-input" placeholder="Search events...">
    <div class="toolbar-right">
      <label style="font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" id="show-past" style="accent-color:var(--gold)"> Show past
      </label>
      <button class="btn btn-gold btn-sm" id="add-event-btn">+ Add Event</button>
    </div>
  </div>

  <!-- ---- Featured Cards Manager ---- -->
  <div class="feat-manager" id="featured-manager">
    <h2><span class="feat-star">&#10022;</span> Featured Cards</h2>
    <div class="feat-slots" id="feat-slots">
      <div class="feat-slot" data-slot="1"><div class="feat-slot-label">Slot 1 (Left)</div><div class="feat-slot-empty">Empty</div></div>
      <div class="feat-slot" data-slot="2"><div class="feat-slot-label">Slot 2 (Center)</div><div class="feat-slot-empty">Empty</div></div>
      <div class="feat-slot" data-slot="3"><div class="feat-slot-label">Slot 3 (Right)</div><div class="feat-slot-empty">Empty</div></div>
    </div>
    <div class="feat-candidates" id="feat-candidates">
      <div class="feat-candidates-head">
        <span>Available posts &amp; events</span>
        <button id="feat-refresh">Refresh</button>
      </div>
      <div id="feat-cand-list"><div class="feat-loading">Loading...</div></div>
    </div>
  </div>

  <div class="table-wrap">
    <table class="ev-table">
      <thead>
        <tr>
          <th data-sort="image_url">Img</th>
          <th data-sort="event_date">Date ▼</th>
          <th data-sort="title">Title</th>
          <th data-sort="venue">Venue</th>
          <th data-sort="category">Category</th>
          <th data-sort="source_name">Source</th>
          <th data-sort="editors_pick">Pick</th>
          <th data-sort="featured_order">Feat</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="events-tbody"></tbody>
    </table>
    <div class="table-footer">
      <span id="table-count"></span>
      <div style="display:flex;gap:6px;">
        <button id="prev-page">← Prev</button>
        <button id="next-page">Next →</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ EVENT FORM MODAL ============ -->
<div class="modal-overlay" id="event-modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Add Event</h2>
      <button class="close-btn" id="modal-close">×</button>
    </div>
    <div class="modal-body">
      <div id="form-status" class="status-msg"></div>
      <input type="hidden" id="ev-id">

      <div class="form-row">
        <div class="form-group">
          <label for="ev-title">Title *</label>
          <input type="text" id="ev-title" required>
        </div>
        <div class="form-group">
          <label for="ev-slug">Slug</label>
          <input type="text" id="ev-slug" placeholder="auto-generated">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="ev-date">Event Date *</label>
          <input type="date" id="ev-date" required>
        </div>
        <div class="form-group">
          <label for="ev-time">Time</label>
          <input type="text" id="ev-time" placeholder="7:00 PM">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="ev-venue">Venue</label>
          <input type="text" id="ev-venue">
        </div>
        <div class="form-group">
          <label for="ev-address">Address</label>
          <input type="text" id="ev-address">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="ev-neighborhood">Neighborhood</label>
          <input type="text" id="ev-neighborhood">
        </div>
        <div class="form-group">
          <label for="ev-city">City</label>
          <select id="ev-city">
            <option value="sf">San Francisco</option>
            <option value="oakland">Oakland</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="ev-category">Category</label>
          <select id="ev-category">
            <option value="Events">Events</option>
            <option value="Music">Music</option>
            <option value="Art & Culture">Art & Culture</option>
            <option value="Comedy">Comedy</option>
            <option value="Community">Community</option>
            <option value="Festivals">Festivals</option>
            <option value="Film & Media">Film & Media</option>
            <option value="Food & Drink">Food & Drink</option>
            <option value="Nightlife">Nightlife</option>
            <option value="Sports & Recreation">Sports & Recreation</option>
            <option value="Theater">Theater</option>
            <option value="Outdoor">Outdoor</option>
            <option value="Family">Family</option>
            <option value="Free">Free</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ev-price">Price</label>
          <input type="text" id="ev-price" placeholder="Free, $25, $10-$50">
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label for="ev-image">Image URL</label>
          <input type="url" id="ev-image" placeholder="https://...">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="ev-ticket-url">Ticket URL</label>
          <input type="url" id="ev-ticket-url" placeholder="https://...">
        </div>
        <div class="form-group">
          <label for="ev-performers">Performers</label>
          <input type="text" id="ev-performers">
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label for="ev-description">Description</label>
          <textarea id="ev-description" rows="4"></textarea>
        </div>
      </div>

      <div style="display:flex;gap:20px;flex-wrap:wrap;">
        <div class="form-check">
          <input type="checkbox" id="ev-editors-pick">
          <label for="ev-editors-pick">Editor's Pick</label>
        </div>
        <div class="form-check">
          <input type="checkbox" id="ev-featured-candidate">
          <label for="ev-featured-candidate" style="color:var(--gold);font-weight:600;">Feature Candidate</label>
        </div>
        <div class="form-check">
          <input type="checkbox" id="ev-sold-out">
          <label for="ev-sold-out">Sold Out</label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <div class="left-actions">
        <button class="btn btn-danger btn-sm" id="form-delete" style="display:none;">Delete</button>
      </div>

  // ---- Load Events ----

      return;

    allEvents = data || [];
    applyFilters();

  // ---- Filter & Sort ----
  function applyFilters() {
    var q = $searchInput.value.toLowerCase().trim();
    filteredEvents = allEvents.filter(function(ev) {
      if (!q) return true;
      return (ev.title || '').toLowerCase().includes(q)
        || (ev.venue || '').toLowerCase().includes(q)
        || (ev.category || '').toLowerCase().includes(q)
        || (ev.neighborhood || '').toLowerCase().includes(q)
        || (ev.description || '').toLowerCase().includes(q);
    });

    filteredEvents.sort(function(a, b) {
      var va = a[sortCol];
      var vb = b[sortCol];
      // Booleans: true first when descending
      if (typeof va === 'boolean' || typeof vb === 'boolean') {
        va = va ? 1 : 0;
        vb = vb ? 1 : 0;
      }
      // Nulls/undefined to bottom
      if (va == null) va = '';
      if (vb == null) vb = '';
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });

    currentPage = 0;
    renderTable();
  }

  $searchInput.addEventListener('input', applyFilters);
  $showPast.addEventListener('change', loadEvents);

  // ---- Sort headers ----
  document.querySelectorAll('.ev-table th[data-sort]').forEach(function(th) {
    th.addEventListener('click', function() {
      var col = th.getAttribute('data-sort');
      if (sortCol === col) {
        sortAsc = !sortAsc;
      } else {
        sortCol = col;
        sortAsc = true;
      }
      // Update header arrows
      document.querySelectorAll('.ev-table th[data-sort]').forEach(function(h) {
        h.textContent = h.textContent.replace(/ [▼▲]/g, '');

      th.textContent += sortAsc ? ' ▲' : ' ▼';
      applyFilters();
    });
  });

  // ---- Render Table ----
  function renderTable() {
    var start = currentPage * PAGE_SIZE;
    var page = filteredEvents.slice(start, start + PAGE_SIZE);
    var total = filteredEvents.length;

    if (page.length === 0) {
      $tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:#888;">No events found</td></tr>';
    } else {
      $tbody.innerHTML = page.map(function(ev) {
        var dateStr = ev.event_date ? new Date(ev.event_date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
        var src = ev.source_name || 'Manual';
        var srcClass = src === 'Manual' ? 'manual' : '';
        var imgHtml = ev.image_url
          ? '<img src="' + esc(ev.image_url) + '" alt="" onerror="this.style.display=\'none\'">'
          : '<div style="width:44px;height:44px;background:#eee;border-radius:4px;"></div>';
        return '<tr data-id="' + ev.id + '">'
          + '<td class="thumb-cell">' + imgHtml + '</td>'
          + '<td>' + esc(dateStr) + '</td>'
          + '<td class="title-cell">' + esc(ev.title) + '</td>'
          + '<td>' + esc(ev.venue || '') + '</td>'
          + '<td>' + esc(ev.category || 'Events') + '</td>'
          + '<td><span class="source-badge ' + srcClass + '">' + esc(src) + '</span></td>'
          + '<td><input type="checkbox" class="pick-toggle" ' + (ev.editors_pick ? 'checked' : '') + ' data-id="' + ev.id + '"></td>'
          + '<td>' + (ev.featured_order ? '<span style="display:inline-block;background:var(--gold);color:var(--dark);font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;">' + ev.featured_order + '</span>' : '') + '</td>'
          + '<td class="actions-cell">'
          + '<button class="edit-btn" title="Edit">✏️</button>'
          + '<button class="del-btn" title="Delete">🗑️</button>'
          + '</td></tr>';
      }).join('');
    }

    $tableCount.textContent = 'Showing ' + (start + 1) + '–' + Math.min(start + PAGE_SIZE, total) + ' of ' + total + ' events';
    $prevPage.disabled = currentPage === 0;
    $nextPage.disabled = start + PAGE_SIZE >= total;
  }

  $prevPage.addEventListener('click', function() { currentPage--; renderTable(); });
  $nextPage.addEventListener('click', function() { currentPage++; renderTable(); });

  // ---- Table click handlers ----
  $tbody.addEventListener('click', function(e) {
    // Edit button
    if (e.target.classList.contains('edit-btn')) {
      var tr = e.target.closest('tr');
      var id = tr.getAttribute('data-id');

      if (ev) openForm(ev);
    }
    // Delete button
    if (e.target.classList.contains('del-btn')) {
      var tr = e.target.closest('tr');
      var id = tr.getAttribute('data-id');
      var ev = allEvents.find(function(x) { return x.id === id; });

  // ---- Pick toggle (direct in table) ----
  $tbody.addEventListener('change', function(e) {

  // ---- Add Event ----
  $addBtn.addEventListener('click', function() { openForm(null); });

  // ---- Form ----
  function openForm(ev) {

    document.getElementById('ev-time').value = ev ? ev.time || '' : '';
    document.getElementById('ev-venue').value = ev ? ev.venue || '' : '';
    document.getElementById('ev-address').value = ev ? ev.address || '' : '';

    document.getElementById('ev-editors-pick').checked = ev ? !!ev.editors_pick : false;
    document.getElementById('ev-featured-candidate').checked = ev ? !!ev.featured : false;

    $modal.classList.add('active');

  function closeForm() {

  $modalClose.addEventListener('click', closeForm);
  $formCancel.addEventListener('click', closeForm);
  $modal.addEventListener('click', function(e) {

  // ---- Auto-generate slug ----
  document.getElementById('ev-title').addEventListener('input', function() {
    if (editingId) return; // Don't auto-change slug when editing
    var title = this.value;
    var date = document.getElementById('ev-date').value;
    document.getElementById('ev-slug').value = makeSlug(title, date);
  });
  document.getElementById('ev-date').addEventListener('input', function() {
    if (editingId) return;
    var title = document.getElementById('ev-title').value;

  function makeSlug(title, date) {
    var slug = (title || '').toLowerCase()
      .replace(/[^a-z0-9\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '');
    if (date) slug += '-' + date;
    return slug;
  }

  // ---- Save Event ----
  $formSave.addEventListener('click', async function() {

    // Only set source_name for new events; don't overwrite scraped source on edits

    $formSave.textContent = 'Saving...';

    if (result.error) {
      showFormMsg('error', 'Error: ' + result.error.message);

    showFormMsg('success', editingId ? 'Event updated!' : 'Event created!');

  // ---- Delete ----

  $confirmNo.addEventListener('click', function() {

  // ---- Helpers ----
  function esc(s) {

  // ---- Ghost API Config ----
  var GHOST_URL = 'https://the-bold-italic.ghost.io';
  var GHOST_CONTENT_KEY = '6e6898c6a63b5488d346a68511';
  var GHOST_ADMIN_KEY_ID = '699a5655870daf000120af35';
  var GHOST_ADMIN_SECRET = 'a04911d717b074970d6b4b17c8b0502f57c9a88e02f62510eb0509fcb7954348';

  // ---- Ghost Admin JWT (Web Crypto) ----
  function hexToBytes(hex) {
    var bytes = new Uint8Array(hex.length / 2);
    for (var i = 0; i < hex.length; i += 2) {
      bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
    }
    return bytes;
  }

  function base64url(buf) {
    var str = '';
    var bytes = new Uint8Array(buf);
    for (var i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
    return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  async function createGhostAdminJWT() {
    var now = Math.floor(Date.now() / 1000);
    var header = { alg: 'HS256', typ: 'JWT', kid: GHOST_ADMIN_KEY_ID };
    var payload = { iat: now, exp: now + 300, aud: '/admin/' };
    var enc = new TextEncoder();
    var headerB64 = base64url(enc.encode(JSON.stringify(header)));
    var payloadB64 = base64url(enc.encode(JSON.stringify(payload)));
    var sigInput = headerB64 + '.' + payloadB64;
    var keyData = hexToBytes(GHOST_ADMIN_SECRET);
    var key = await crypto.subtle.importKey('raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    var sig = await crypto.subtle.sign('HMAC', key, enc.encode(sigInput));
    return sigInput + '.' + base64url(sig);
  }

  // ---- Featured Slots Manager ----
  var ghostFeaturedPosts = [];
  var currentSlots = {};

  async function fetchGhostFeaturedPosts() {
    try {
      var url = GHOST_URL + '/ghost/api/content/posts/?key=' + GHOST_CONTENT_KEY
        + '&filter=tag:hash-featuredevent&limit=10&include=tags&formats=html'
        + '&fields=id,slug,title,url,feature_image,custom_excerpt';
      var resp = await fetch(url);
      var data = await resp.json();
      if (!data.posts) return [];
      return data.posts.map(function(p) {
        var category = 'Events';
        (p.tags || []).forEach(function(t) {
          if (t.name.charAt(0) === '#' && t.name !== '#featuredevent' && t.name !== '#eventscal' && t.name !== '#events' && t.name !== '#hidden') {
            category = t.name.slice(1);
          }
        });
        return {
          id: p.id,
          slug: p.slug,
          title: p.title,
          image: p.feature_image || '',
          url: p.url,
          category: category,
          excerpt: p.custom_excerpt || '',
          source: 'ghost',
          tags: p.tags || []
        };
      });
    } catch (err) {
      console.warn('Ghost fetch failed:', err);
      return [];
    }
  }

  async function loadFeaturedSlots() {
    var { data, error } = await sb.from('featured_slots').select('*').order('slot', { ascending: true });
    if (error) { console.warn('Failed to load slots:', error.message); return {}; }
    var slots = {};
    (data || []).forEach(function(row) { slots[row.slot] = row; });
    return slots;
  }

  async function loadFeaturedManager() {
    var $mgr = document.getElementById('featured-manager');
    if (!$mgr) return;
    var results = await Promise.all([fetchGhostFeaturedPosts(), loadFeaturedSlots()]);
    ghostFeaturedPosts = results[0];
    currentSlots = results[1];
    // Get Supabase events marked as feature candidates
    var { data: featEvents } = await sb.from('events').select('*').eq('featured', true);
    var supabaseCandidates = (featEvents || []).map(function(ev) {
      return {
        id: ev.id,
        slug: ev.slug,
        title: ev.title,
        image: ev.image_url || '',
        url: '/' + ev.slug + '/',
        category: ev.category || 'Events',
        excerpt: ev.description || '',
        source: 'supabase'
      };
    });
    renderFeaturedManager(ghostFeaturedPosts, supabaseCandidates, currentSlots);
  }

  function renderFeaturedManager(ghostPosts, supabaseEvents, slots) {
    // Render slots
    for (var s = 1; s <= 3; s++) {
      var slotEl = document.querySelector('.feat-slot[data-slot="' + s + '"]');
      if (!slotEl) continue;
      var data = slots[s];
      if (data) {
        slotEl.classList.add('filled');
        var srcLabel = data.source_type === 'ghost' ? 'Ghost post' : 'Supabase event';
        slotEl.innerHTML = '<div class="feat-slot-label">Slot ' + s + ' (' + ['Left', 'Center', 'Right'][s - 1] + ')</div>'
          + '<button class="feat-slot-clear" data-slot="' + s + '" title="Clear slot">&times;</button>'
          + '<div class="feat-slot-content">'
          + (data.image_url ? '<img class="feat-slot-img" src="' + esc(data.image_url) + '" onerror="this.style.display=\'none\'">' : '')
          + '<div class="feat-slot-info"><h4>' + esc(data.title) + '</h4>'
          + '<span class="feat-slot-source">' + srcLabel + '</span></div></div>';
      } else {
        slotEl.classList.remove('filled');
        slotEl.innerHTML = '<div class="feat-slot-label">Slot ' + s + ' (' + ['Left', 'Center', 'Right'][s - 1] + ')</div>'
          + '<div class="feat-slot-empty">Empty &mdash; assign from below</div>';
      }
    }

    // Build candidate list
    var $list = document.getElementById('feat-cand-list');
    // Combine Ghost + Supabase candidates, mark which are already slotted
    var slottedIds = {};
    Object.values(slots).forEach(function(s) { slottedIds[s.source_type + ':' + s.source_id] = s.slot; });

    var candidates = [];
    ghostPosts.forEach(function(p) {
      candidates.push({
        id: p.id,
        slug: p.slug,
        title: p.title,
        image: p.image,
        url: p.url,
        category: p.category,
        excerpt: p.excerpt,
        source: 'ghost',
        sourceLabel: 'Ghost',
        assignedSlot: slottedIds['ghost:' + p.slug] || null,
        ghostId: p.id,
        tags: p.tags
      });
    });
    supabaseEvents.forEach(function(ev) {
      // Skip if already in Ghost list (by title match)
      var isDupe = ghostPosts.some(function(gp) { return gp.title.toLowerCase() === ev.title.toLowerCase(); });
      if (isDupe) return;
      candidates.push({
        id: ev.id,
        slug: ev.slug,
        title: ev.title,
        image: ev.image,
        url: ev.url,
        category: ev.category,
        excerpt: ev.excerpt,
        source: 'supabase',
        sourceLabel: 'Supabase',
        assignedSlot: slottedIds['supabase:' + ev.id] || null
      });
    });

    if (candidates.length === 0) {
      $list.innerHTML = '<div class="feat-loading">No #featuredevent posts found in Ghost and no featured Supabase events.</div>';
      return;
    }

    $list.innerHTML = candidates.map(function(c) {
      var slotNote = c.assignedSlot ? ' <span style="color:var(--gold);font-weight:700;">Slot ' + c.assignedSlot + '</span>' : '';
      var imgHtml = c.image ? '<img class="feat-cand-img" src="' + esc(c.image) + '" onerror="this.style.display=\'none\'">' : '<div class="feat-cand-img" style="background:#eee;"></div>';
      var html = '<div class="feat-cand-row">'
        + imgHtml
        + '<div class="feat-cand-info"><h4>' + esc(c.title) + '</h4>'
        + '<span class="feat-cand-meta">' + esc(c.sourceLabel) + ' &middot; ' + esc(c.category) + slotNote + '</span></div>'
        + '<div class="feat-cand-actions">'
        + '<select class="feat-assign-select" data-source="' + c.source + '" data-id="' + esc(c.source === 'ghost' ? c.slug : c.id) + '" data-title="' + esc(c.title) + '" data-image="' + esc(c.image) + '" data-url="' + esc(c.url) + '" data-category="' + esc(c.category) + '" data-excerpt="' + esc(c.excerpt) + '">'
        + '<option value="">Assign...</option>'
        + '<option value="1"' + (c.assignedSlot === 1 ? ' selected' : '') + '>Slot 1</option>'
        + '<option value="2"' + (c.assignedSlot === 2 ? ' selected' : '') + '>Slot 2</option>'
        + '<option value="3"' + (c.assignedSlot === 3 ? ' selected' : '') + '>Slot 3</option>'
        + '</select>';
      if (c.source === 'ghost') {
        html += '<button class="feat-remove-tag" data-ghost-id="' + esc(c.ghostId) + '" data-title="' + esc(c.title) + '" title="Remove #featuredevent tag from Ghost">Untag</button>';
      }
      html += '</div></div>';
      return html;
    }).join('');
  }

  // ---- Assign to slot (upsert into featured_slots) ----
  async function assignSlot(slot, sourceType, sourceId, title, imageUrl, url, category, excerpt) {
    var { error } = await sb.from('featured_slots').upsert({
      slot: parseInt(slot),
      source_type: sourceType,
      source_id: sourceId,
      title: title,
      image_url: imageUrl,
      url: url,
      category: category,
      excerpt: excerpt,
      updated_at: new Date().toISOString()
    }, { onConflict: 'slot' });
    if (error) {
      alert('Failed to assign slot: ' + error.message);
      return;
    }
    loadFeaturedManager();
  }

  // ---- Clear slot ----
  async function clearSlot(slot) {
    var { error } = await sb.from('featured_slots').delete().eq('slot', parseInt(slot));
    if (error) {
      alert('Failed to clear slot: ' + error.message);
      return;
    }
    loadFeaturedManager();
  }

  // ---- Remove #featuredevent tag from Ghost post via Admin API ----
  async function removeGhostTag(ghostPostId, postTitle) {
    if (!confirm('Remove #featuredevent tag from "' + postTitle + '" in Ghost?')) return;
    try {
      var jwt = await createGhostAdminJWT();
      // First fetch the post to get current tags and updated_at
      var getResp = await fetch(GHOST_URL + '/ghost/api/admin/posts/' + ghostPostId + '/?formats=mobiledoc', {
        headers: { 'Authorization': 'Ghost ' + jwt }
      });
      var getData = await getResp.json();
      if (!getData.posts || !getData.posts[0]) { alert('Could not find post in Ghost'); return; }
      var post = getData.posts[0];
      var newTags = (post.tags || []).filter(function(t) { return t.name !== '#featuredevent'; });
      // Update the post
      var updateResp = await fetch(GHOST_URL + '/ghost/api/admin/posts/' + ghostPostId + '/', {
        method: 'PUT',
        headers: {
          'Authorization': 'Ghost ' + jwt,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          posts: [{
            tags: newTags,
            updated_at: post.updated_at
          }]
        })
      });
      var updateData = await updateResp.json();
      if (updateData.errors) {
        alert('Ghost API error: ' + (updateData.errors[0] || {}).message);
        return;
      }
      alert('Tag removed from "' + postTitle + '"');
      loadFeaturedManager();
    } catch (err) {
      alert('Failed to update Ghost post: ' + err.message);
    }
  }

  // ---- Featured manager event delegation ----
  document.addEventListener('change', function(e) {
    if (e.target.classList.contains('feat-assign-select')) {
      var val = e.target.value;
      if (!val) return;
      var el = e.target;
      assignSlot(val, el.dataset.source, el.dataset.id, el.dataset.title, el.dataset.image, el.dataset.url, el.dataset.category, el.dataset.excerpt);
    }
  });

  document.addEventListener('click', function(e) {
    if (e.target.classList.contains('feat-slot-clear')) {
      var slot = e.target.dataset.slot;
      clearSlot(slot);
    }
    if (e.target.classList.contains('feat-remove-tag')) {
      removeGhostTag(e.target.dataset.ghostId, e.target.dataset.title);
    }
    if (e.target.id === 'feat-refresh') {
      document.getElementById('feat-cand-list').innerHTML = '<div class="feat-loading">Loading...</div>';
      loadFeaturedManager();
    }
  });

  // ---- Init ----
  checkSession();

})();
</script>
</body>
</html>
