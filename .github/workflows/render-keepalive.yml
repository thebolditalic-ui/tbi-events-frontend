name: Render keep-alive (tbi-content-engine)

# Best-effort ping of the backend's /api/health to nudge Render's free tier.
# NOTE: GitHub throttles high-frequency scheduled workflows heavily — in practice
# this runs every few HOURS, not every 5 min, so it is not a reliable keep-alive.
# A missed ping (usually a Render cold-start timeout) is logged as a warning and
# does NOT fail the run, so it never emails the repo owner. For true uptime use an
# external pinger (e.g. cron-job.org / UptimeRobot).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health (best-effort, never fails the run)
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 60 https://tbi-content-engine.onrender.com/api/health || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then cat /tmp/body.txt; echo; echo "service awake"; exit 0; fi
            sleep 20
          done
          echo "::warning::keep-alive ping did not return 200 after 3 tries (likely a Render cold start). Not failing the run."
          exit 0
