name: Render keep-alive (tbi-content-engine)

# Pings the backend's /api/health every ~5 minutes so Render's free tier
# never sleeps the service. While the service is awake, its in-process
# node-cron fires the 8-hour event sync reliably. A failed ping turns this
# run red and GitHub emails the repo owner -- so an outage is visible, not silent.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/health
        run: |
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 60 https://tbi-content-engine.onrender.com/api/health)
          echo "HTTP $code"
          cat /tmp/body.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::health check returned $code"
            exit 1
          fi
