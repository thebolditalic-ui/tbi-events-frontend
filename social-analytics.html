<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TBI Social — Analytics</title>
<link rel="icon" href="https://www.thebolditalic.com/content/images/size/w256h256/2025/04/TBILogo-copy.png" type="image/png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--cream:#fff6e6;--dark:#1E1B1B;--gold:#FFD682;--blue:#5b7bd5;--red:#e74c3c;--green:#27ae60;--border:#e0d8cc;--bg-alt:#faf5eb;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--title-font:'Georgia',serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--cream);color:var(--dark);min-height:100vh;}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:40px;width:100%;max-width:380px;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.login-box h1{font-family:var(--title-font);font-size:22px;margin-bottom:6px;}
.login-box p{color:#888;font-size:13px;margin-bottom:24px;}
.login-box label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#666;margin-bottom:4px;}
.login-box input[type="email"],.login-box input[type="password"]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;margin-bottom:16px;background:var(--bg-alt);}
.login-box input:focus{outline:none;border-color:var(--blue);}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity 0.15s;}
.btn:hover{opacity:0.85;}
.btn-primary{background:var(--dark);color:#fff;width:100%;}
.btn-gold{background:var(--gold);color:var(--dark);}
.btn-sm{padding:6px 14px;font-size:12px;}
.login-error{color:var(--red);font-size:13px;margin-bottom:12px;display:none;}
#admin-app{display:none;}
.admin-header{background:var(--dark);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
.admin-header-left{display:flex;align-items:center;gap:20px;}
.admin-header h1{font-family:var(--title-font);font-size:18px;font-weight:400;}
.admin-nav{display:flex;gap:4px;}
.admin-nav a{color:rgba(255,255,255,0.5);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:4px;}
.admin-nav a:hover{color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.06);}
.admin-nav a.active{color:#fff;background:rgba(255,255,255,0.12);}
.user-info{display:flex;align-items:center;gap:14px;font-size:13px;color:rgba(255,255,255,0.75);}
.page-wrap{max-width:1100px;margin:0 auto;padding:24px;}
.section-title{font-family:var(--title-font);font-size:22px;margin:0 0 6px;}
.section-sub{color:#888;font-size:13px;margin-bottom:18px;}
.admin-subnav{display:flex;gap:2px;flex-wrap:wrap;align-items:center;padding:0 24px;background:#fff;border-bottom:1px solid #e7e2d8;}
.admin-subnav a{padding:11px 15px;font-size:13px;font-weight:500;color:#777;text-decoration:none;border-bottom:2px solid transparent;transition:all .15s;}
.admin-subnav a:hover{color:#1a1a1a;}
.admin-subnav a.active{color:#1a1a1a;font-weight:600;border-bottom-color:#1a1a1a;}
/* ---- analytics dashboard ---- */
.sa-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px;}
.sa-windows{display:flex;flex-wrap:wrap;gap:4px;background:#fff;border:1px solid var(--border);border-radius:9px;padding:3px;}
.sa-windows button{border:none;background:transparent;color:#6b6258;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:6px;cursor:pointer;transition:all .12s;}
.sa-windows button:hover{background:var(--bg-alt);}
.sa-windows button.on{background:var(--dark);color:#fff;}
.sa-custom{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#6b6258;}
.sa-custom input{border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12.5px;font-family:inherit;background:#fff;}
.sa-spacer{flex:1;}
#sa-refresh{background:var(--gold);color:var(--dark);border:none;}
#sa-updated{font-size:12px;color:#a99;}
.sa-loading,.sa-error{background:#fff;border:1px solid var(--border);border-radius:12px;padding:40px;text-align:center;color:#8a8178;font-size:14px;}
.sa-error{color:var(--red);}
.sa-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px;}
.sa-tile{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 16px 14px;}
.sa-tile .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#a0968a;margin-bottom:7px;}
.sa-tile .val{font-family:var(--title-font);font-size:27px;line-height:1;color:var(--dark);}
.sa-tile .sub{font-size:11px;color:#b3a99c;margin-top:5px;height:13px;}
.sa-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px;}
.sa-chart-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.sa-metricsel{display:flex;gap:4px;flex-wrap:wrap;}
.sa-metricsel button{border:1px solid var(--border);background:#fff;color:#6b6258;font-size:12px;font-weight:600;padding:6px 11px;border-radius:7px;cursor:pointer;}
.sa-metricsel button.on{background:var(--dark);color:#fff;border-color:var(--dark);}
.sa-toggles{display:flex;gap:12px;flex-wrap:wrap;}
.sa-toggles label{display:flex;align-items:center;gap:5px;font-size:12.5px;color:#5a5249;cursor:pointer;user-select:none;}
.sa-toggles .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.sa-chart-wrap{position:relative;height:300px;}
.sa-table{width:100%;border-collapse:collapse;font-size:13px;}
.sa-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#a0968a;font-weight:700;padding:6px 10px;border-bottom:1px solid var(--border);}
.sa-table td{padding:9px 10px;border-bottom:1px solid #f0ebe1;}
.sa-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
.sa-table tr:last-child td{border-bottom:none;}
.sa-ch{display:flex;align-items:center;gap:8px;font-weight:600;}
.sa-ch .dot{width:9px;height:9px;border-radius:50%;}
.sa-pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
.sa-pill.live{background:rgba(39,174,96,.13);color:#1e8c4f;}
.sa-pill.warn{background:rgba(255,184,0,.18);color:#8a6d1f;}
.sa-pill.na{background:#f0ebe1;color:#a0968a;}
.sa-note{font-size:12px;color:#a0968a;margin-top:12px;line-height:1.5;}
.sa-note b{color:#8a6d1f;font-weight:700;}
@media(max-width:768px){html,body{overflow-x:hidden;}.admin-header{flex-direction:column;align-items:stretch;gap:10px;padding:12px 16px;}.admin-header-left{flex-direction:column;align-items:stretch;gap:8px;}.admin-header h1{font-size:17px;}.admin-nav{flex-wrap:wrap;overflow:visible;row-gap:4px;}.admin-nav a{white-space:nowrap;}.admin-header .user-info{width:100%;justify-content:space-between;}.admin-subnav{padding:0 12px;}.sa-tiles{grid-template-columns:repeat(2,1fr);}.sa-table{font-size:12px;}.sa-table .hide-sm{display:none;}}
</style>
<style>/* tbi-nav-normalize-v5 — uniform header (desktop+mobile) + centered pill nav + EdsMarket brand + pinned user box */
@font-face{font-family:'EdsMarket';src:url('https://scawgrjcjgcmvsimvash.supabase.co/storage/v1/object/public/site-assets/EdsMarketRegularSlant.woff2') format('woff2');font-display:swap;}
.admin-header, .page-header .header-top{ border-bottom:1px solid rgba(255,255,255,.9); }
.admin-header h1, .page-header h1, .header-top h1{ font-family:'EdsMarket', var(--title-font), Georgia, serif; font-weight:400; }
.admin-header h1 .adm, .page-header h1 .adm, .header-top h1 .adm{
  font-family:'Helvetica Neue',Arial,sans-serif; font-weight:500; font-size:11px;
  text-transform:uppercase; letter-spacing:.18em; color:rgba(255,255,255,.55);

}
.admin-nav a{

.admin-nav a:hover{ color:#fff; background:rgba(255,255,255,.08); }
.admin-nav a.active{ color:var(--gold); background:rgba(255,214,130,.14); border-color:rgba(255,214,130,.34); }
.user-info{ display:flex; align-items:center; gap:12px; }
#user-email{ font-family:'Helvetica Neue',Arial,sans-serif !important; font-size:13px !important;

#logout-btn{ display:inline-flex !important; align-items:center !important; justify-content:center !important;

  line-height:1.1 !important; text-transform:none !important; letter-spacing:normal !important;

  border:1px solid rgba(255,255,255,.24) !important; border-radius:8px !important; box-shadow:none !important;
  white-space:nowrap !important; cursor:pointer; }
#logout-btn:hover{ background:rgba(255,255,255,.18) !important; }
@media(min-width:769px){
  .admin-header, .page-header .header-top{
    box-sizing:border-box; position:relative;
    display:flex; align-items:center; justify-content:space-between;
    min-height:60px; padding:8px 24px;
  }
  .admin-header h1, .page-header h1, .header-top h1{ font-size:22px; margin:0; line-height:1.1; }
  .admin-nav{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:flex; gap:6px; flex-wrap:nowrap; width:auto;
  }
  .admin-subnav{ justify-content:center; }
}
@media(max-width:768px){
  .admin-header, .page-header .header-top{
    position:static !important; min-height:0 !important; box-sizing:border-box;
    display:flex !important; flex-direction:column !important; align-items:stretch !important;
    gap:10px !important; padding:12px 14px !important;
  }
  .admin-header-left, .page-header .header-left{ display:flex !important; flex-direction:column !important; align-items:stretch !important; gap:10px !important; }
  .admin-header h1, .page-header h1, .header-top h1{ font-size:20px !important; line-height:1.1 !important; margin:0 !important; text-align:center; }
  .admin-nav{ position:static !important; transform:none !important; display:flex !important; flex-wrap:wrap !important; justify-content:center !important; gap:6px !important; width:100% !important; }
  .user-info, .page-header .header-top > div:last-child{ width:100% !important; justify-content:space-between !important; }
  .admin-subnav{ justify-content:center !important; flex-wrap:wrap; }
}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <h1>TBI Social</h1>
    <p>Sign in to continue.</p>
    <div class="login-error" id="login-error"></div>
    <label for="login-email">Email</label>
    <input type="email" id="login-email" autocomplete="email">
    <label for="login-pass">Password</label>
    <input type="password" id="login-pass" autocomplete="current-password">
    <button class="btn btn-primary" id="login-btn">Sign In</button>
  </div>
</div>
<div id="admin-app">
  <header class="admin-header">
    <div class="admin-header-left">
      <h1><a href="/admin" style="color:inherit;text-decoration:none" title="Back to the dashboard">The Bold Italic <span class="adm">ADMIN</span></a></h1>
      <nav class="admin-nav">
        <a href="/admin">Dashboard</a>
        <a href="/social" class="active">Social</a>
        <a href="/events">Events</a>
        <a href="/banners">Banners</a>
        <a href="/links">Short Links</a>
        <a href="/news_desk">Content Farm</a>
        <a href="/games">Games</a>
      </nav>
    </div>
    <div class="user-info">
      <span id="user-email"></span>
      <button class="btn btn-sm" id="logout-btn" style="background:rgba(255,255,255,0.12);color:#ccc;border:1px solid rgba(255,255,255,0.25);">Sign Out</button>
    </div>
  </header>
  <nav class="admin-subnav">
    <a href="/social">Social</a>
    <a href="/social-analytics" class="active">Analytics</a>
  </nav>
  <div class="page-wrap">
    <h2 class="section-title">Social analytics</h2>
    <p class="section-sub">How your posts perform across channels. <span id="sa-updated"></span></p>

    <div class="sa-controls">
      <div class="sa-windows" id="sa-windows"></div>
      <div class="sa-custom" id="sa-custom" style="display:none">
        <input type="date" id="sa-from"><span>to</span><input type="date" id="sa-to">
      </div>
      <div class="sa-spacer"></div>
      <button class="btn btn-sm" id="sa-refresh">&#8635; Refresh</button>
    </div>

    <div id="sa-loading" class="sa-loading">Loading metrics&hellip;</div>
    <div id="sa-error" class="sa-error" style="display:none"></div>

    <div id="sa-body" style="display:none">
      <div class="sa-tiles" id="sa-tiles"></div>
      <div class="sa-card">
        <div class="sa-chart-head">
          <div class="sa-metricsel" id="sa-metricsel"></div>
          <div class="sa-toggles" id="sa-toggles"></div>
        </div>
        <div class="sa-chart-wrap"><canvas id="sa-chart"></canvas></div>
      </div>
      <div class="sa-card">
        <table class="sa-table" id="sa-table"></table>
        <p class="sa-note" id="sa-note"></p>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var SUPABASE_URL='https://scawgrjcjgcmvsimvash.supabase.co';
  var SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjYXdncmpjamdjbXZzaW12YXNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3NzAxMDIsImV4cCI6MjA4ODM0NjEwMn0.lmks8ntJPZ0giQEpuH3tSSBllzmOj20oUrb96kBIdh0';
  var sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
  var $ls=document.getElementById('login-screen'),$app=document.getElementById('admin-app');
  var $em=document.getElementById('login-email'),$pw=document.getElementById('login-pass');
  var $bt=document.getElementById('login-btn'),$er=document.getElementById('login-error');
  var $out=document.getElementById('logout-btn'),$ue=document.getElementById('user-email');
  var started=false;
  function showAdmin(u){ $ls.style.display='none'; $app.style.display='block'; $ue.textContent=(u&&u.email)||''; if(!started){ started=true; SA.init(); } }
  async function checkSession(){ var s=await sb.auth.getSession(); if(s.data&&s.data.session) showAdmin(s.data.session.user); }
  $bt.addEventListener('click', async function(){ $er.style.display='none'; var e=$em.value.trim(),p=$pw.value; if(!e||!p){ $er.textContent='Enter email and password'; $er.style.display='block'; return; } $bt.textContent='Signing in...'; $bt.disabled=true; var r=await sb.auth.signInWithPassword({email:e,password:p}); $bt.textContent='Sign In'; $bt.disabled=false; if(r.error){ $er.textContent=r.error.message; $er.style.display='block'; return; } showAdmin(r.data.user); });
  $pw.addEventListener('keydown', function(ev){ if(ev.key==='Enter') $bt.click(); });
  $out.addEventListener('click', async function(){ await sb.auth.signOut(); location.reload(); });

  // ---------------- analytics dashboard ----------------
  var CH=[['facebook','Facebook','#1877f2'],['instagram','Instagram','#d6336c'],['threads','Threads','#111111'],['bluesky','Bluesky','#0a7aff']];
  var METRICS=[['reactions','Reactions / Likes'],['comments','Comments / Replies'],['shares','Shares / Reposts'],['impressions','Views / Impressions']];
  var WINDOWS=[1,3,7,14,30,45,60,90];
  var SA={ raw:null, win:30, custom:null, metric:'reactions', on:{facebook:true,instagram:true,threads:true,bluesky:true}, chart:null };
  var $=function(id){return document.getElementById(id);};
  function fmt(n){ n=n||0; return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':String(n); }

  SA.init=function(){
    // window pills
    var w=$('sa-windows'), html='';
    WINDOWS.forEach(function(d){ html+='<button data-w="'+d+'">'+d+'d</button>'; });
    html+='<button data-w="custom">Custom</button>';
    w.innerHTML=html;
    w.querySelectorAll('button').forEach(function(b){ b.onclick=function(){
      if(b.dataset.w==='custom'){ $('sa-custom').style.display='flex'; SA.applyCustomIfReady(); }
      else { SA.custom=null; SA.win=parseInt(b.dataset.w,10); $('sa-custom').style.display='none'; SA.paintControls(); SA.render(); }
    };});
    $('sa-from').onchange=$('sa-to').onchange=SA.applyCustomIfReady;
    // metric selector
    var m=$('sa-metricsel'), mh='';
    METRICS.forEach(function(x){ mh+='<button data-m="'+x[0]+'">'+x[1]+'</button>'; });
    m.innerHTML=mh;
    m.querySelectorAll('button').forEach(function(b){ b.onclick=function(){ SA.metric=b.dataset.m; SA.paintControls(); SA.renderChart(); };});
    // channel toggles
    var t=$('sa-toggles'), th='';
    CH.forEach(function(c){ th+='<label><input type="checkbox" data-c="'+c[0]+'" checked><span class="dot" style="background:'+c[2]+'"></span>'+c[1]+'</label>'; });
    t.innerHTML=th;
    t.querySelectorAll('input').forEach(function(cb){ cb.onchange=function(){ SA.on[cb.dataset.c]=cb.checked; SA.render(); };});
    $('sa-refresh').onclick=function(){ SA.load(true); };
    SA.paintControls();
    SA.load(false);
  };

  SA.applyCustomIfReady=function(){
    var f=$('sa-from').value, t=$('sa-to').value;
    if(f&&t&&f<=t){ SA.custom={from:f,to:t}; SA.paintControls(); SA.render(); }
  };

  SA.paintControls=function(){
    document.querySelectorAll('#sa-windows button').forEach(function(b){
      var on=(b.dataset.w==='custom')?!!SA.custom:(!SA.custom&&parseInt(b.dataset.w,10)===SA.win);
      b.classList.toggle('on',on);
    });
    document.querySelectorAll('#sa-metricsel button').forEach(function(b){ b.classList.toggle('on',b.dataset.m===SA.metric); });
  };

  SA.load=async function(refresh){
    $('sa-loading').style.display='block'; $('sa-loading').textContent=refresh?'Refreshing live metrics (this can take a moment)…':'Loading metrics…';
    $('sa-error').style.display='none'; $('sa-body').style.display='none';
    try{
      var r=await sb.functions.invoke('social-analytics',{body:{action:'summary',window_days:90,refresh:!!refresh}});
      if(r.error) throw r.error;
      if(!r.data||!r.data.ok) throw new Error((r.data&&r.data.error)||'No data');
      SA.raw=r.data;
      $('sa-loading').style.display='none'; $('sa-body').style.display='block';
      var when=new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
      $('sa-updated').textContent='Updated '+when+'.';
      SA.render();
    }catch(e){
      $('sa-loading').style.display='none';
      $('sa-error').style.display='block';
      $('sa-error').textContent='Could not load analytics: '+((e&&e.message)||e);
    }
  };

  SA.days=function(){
    var rows=(SA.raw&&SA.raw.series)||[];
    if(SA.custom) return rows.filter(function(d){ return d.date>=SA.custom.from && d.date<=SA.custom.to; });
    var cutoff=new Date(Date.now()-(SA.win-1)*864e5).toISOString().slice(0,10);
    return rows.filter(function(d){ return d.date>=cutoff; });
  };

  SA.totals=function(){
    var per={}; CH.forEach(function(c){ per[c[0]]={impressions:0,reactions:0,comments:0,shares:0,posts:0}; });
    SA.days().forEach(function(d){ CH.forEach(function(c){ var v=d[c[0]]||{}; ['impressions','reactions','comments','shares','posts'].forEach(function(k){ per[c[0]][k]+=(v[k]||0); }); }); });
    var grand={impressions:0,reactions:0,comments:0,shares:0,posts:0};
    CH.forEach(function(c){ if(SA.on[c[0]]){ ['impressions','reactions','comments','shares','posts'].forEach(function(k){ grand[k]+=per[c[0]][k]; }); } });
    return {per:per,grand:grand};
  };

  SA.render=function(){ if(!SA.raw) return; var t=SA.totals(); SA.renderTiles(t.grand); SA.renderChart(); SA.renderTable(t.per); };

  SA.renderTiles=function(g){
    var defs=[['posts','Posts',''],['impressions','Views / Impressions','partial'],['reactions','Reactions / Likes',''],['comments','Comments / Replies',''],['shares','Shares / Reposts','']];
    var html='';
    defs.forEach(function(d){
      var sub=(d[2]==='partial')?'FB + Threads need reconnect':'&nbsp;';
      html+='<div class="sa-tile"><div class="lbl">'+d[1]+'</div><div class="val">'+fmt(g[d[0]])+'</div><div class="sub">'+sub+'</div></div>';
    });
    $('sa-tiles').innerHTML=html;
  };

  SA.renderChart=function(){
    var rows=SA.days();
    var labels=rows.map(function(d){ return d.date.slice(5); });
    var ds=[];
    CH.forEach(function(c){ if(!SA.on[c[0]]) return;
      ds.push({label:c[1],data:rows.map(function(d){ return (d[c[0]]&&d[c[0]][SA.metric])||0; }),borderColor:c[2],backgroundColor:c[2],tension:0.3,pointRadius:rows.length>30?0:3,borderWidth:2,fill:false});
    });
    if(SA.chart) SA.chart.destroy();
    var ctx=$('sa-chart').getContext('2d');
    SA.chart=new Chart(ctx,{type:'line',data:{labels:labels,datasets:ds},options:{
      responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{title:function(it){return it[0]?it[0].label:'';}}}},
      scales:{y:{beginAtZero:true,ticks:{precision:0},grid:{color:'#f0ebe1'}},x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12}}}
    }});
  };

  SA.renderTable=function(per){
    var html='<tr><th>Channel</th><th class="num">Posts</th><th class="num">Views</th><th class="num">Reactions</th><th class="num">Comments</th><th class="num">Shares</th><th>Status</th></tr>';
    CH.forEach(function(c){
      var p=per[c[0]], k=c[0];
      var anyEng=(p.reactions+p.comments+p.shares)>0;
      var status,cls;
      if(k==='threads'){ if(p.posts>0&&!anyEng&&p.impressions===0){ status='Reconnect for insights'; cls='warn'; } else { status='Live'; cls='live'; } }
      else if(k==='bluesky'){ status=p.posts>0?'Live':'No posts'; cls=p.posts>0?'live':'na'; }
      else if(k==='facebook'){ status=anyEng?'Live':(p.posts>0?'No engagement':'No posts'); cls=anyEng?'live':'na'; }
      else { status=p.posts>0?(anyEng||p.impressions?'Live':'Stories expire'):'No posts'; cls=(anyEng||p.impressions)?'live':'na'; }
      var views=(k==='bluesky')?'&mdash;':(p.impressions||((k==='facebook'||k==='threads')?'&mdash;':0));
      html+='<tr><td><span class="sa-ch"><span class="dot" style="background:'+c[2]+'"></span>'+c[1]+'</span></td>'
        +'<td class="num">'+p.posts+'</td>'
        +'<td class="num">'+(typeof views==='number'?fmt(views):views)+'</td>'
        +'<td class="num">'+fmt(p.reactions)+'</td>'
        +'<td class="num">'+fmt(p.comments)+'</td>'
        +'<td class="num">'+fmt(p.shares)+'</td>'
        +'<td><span class="sa-pill '+cls+'">'+status+'</span></td></tr>';
    });
    $('sa-table').innerHTML=html;
    $('sa-note').innerHTML='Engagement (reactions, comments, shares) is live for Facebook and Bluesky. <b>Threads metrics and Facebook views need a one-time insights reconnect</b> to populate. Bluesky does not report views. Instagram Stories expire after 24 hours, so only feed posts and reels keep numbers.';
  };

  checkSession();
})();
</script>
</body>
</html>
