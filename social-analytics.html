<head>

<style>
:root{--cream:#fff6e6;--dark:#1E1B1B;--gold:#FFD682;--blue:#5b7bd5;--red:#e74c3c;--green:#27ae60;--border:#e0d8cc;--bg-alt:#faf5eb;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--title-font:'Georgia',serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--cream);color:var(--dark);min-height:100vh;}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:40px;width:100%;max-width:380px;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.login-box h1{font-family:var(--title-font);font-size:22px;margin-bottom:6px;}
.login-box p{color:#888;font-size:13px;margin-bottom:24px;}
.login-box label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#666;margin-bottom:4px;}
.login-box input[type="email"],.login-box input[type="password"]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;margin-bottom:16px;background:var(--bg-alt);}
.login-box input:focus{outline:none;border-color:var(--blue);}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity 0.15s;}
.btn:hover{opacity:0.85;}
.btn-primary{background:var(--dark);color:#fff;width:100%;}
.btn-gold{background:var(--gold);color:var(--dark);}
.btn-sm{padding:6px 14px;font-size:12px;}
.login-error{color:var(--red);font-size:13px;margin-bottom:12px;display:none;}
#admin-app{display:none;}
.admin-header{background:var(--dark);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
.admin-header-left{display:flex;align-items:center;gap:20px;}
.admin-header h1{font-family:var(--title-font);font-size:18px;font-weight:400;}
.admin-nav{display:flex;gap:4px;}
.admin-nav a{color:rgba(255,255,255,0.5);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:4px;}
.admin-nav a:hover{color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.06);}
.admin-nav a.active{color:#fff;background:rgba(255,255,255,0.12);}
.user-info{display:flex;align-items:center;gap:14px;font-size:13px;color:rgba(255,255,255,0.75);}
.page-wrap{max-width:1100px;margin:0 auto;padding:24px;}
.section-title{font-family:var(--title-font);font-size:22px;margin:0 0 6px;}
.section-sub{color:#888;font-size:13px;margin-bottom:18px;}
.admin-subnav{display:flex;gap:2px;flex-wrap:wrap;align-items:center;padding:0 24px;background:#fff;border-bottom:1px solid #e7e2d8;}
.admin-subnav a{padding:11px 15px;font-size:13px;font-weight:500;color:#777;text-decoration:none;border-bottom:2px solid transparent;transition:all .15s;}
.admin-subnav a:hover{color:#1a1a1a;}
.admin-subnav a.active{color:#1a1a1a;font-weight:600;border-bottom-color:#1a1a1a;}
/* ---- analytics dashboard ---- */
.sa-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px;}
.sa-windows{display:flex;flex-wrap:wrap;gap:4px;background:#fff;border:1px solid var(--border);border-radius:9px;padding:3px;}
.sa-windows button{border:none;background:transparent;color:#6b6258;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:6px;cursor:pointer;transition:all .12s;}
.sa-windows button:hover{background:var(--bg-alt);}
.sa-windows button.on{background:var(--dark);color:#fff;}
.sa-custom{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#6b6258;}
.sa-custom input{border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12.5px;font-family:inherit;background:#fff;}
.sa-spacer{flex:1;}
#sa-refresh{background:var(--gold);color:var(--dark);border:none;}
#sa-updated{font-size:12px;color:#a99;}
.sa-loading,.sa-error{background:#fff;border:1px solid var(--border);border-radius:12px;padding:40px;text-align:center;color:#8a8178;font-size:14px;}
.sa-spin{display:inline-block;width:17px;height:17px;border:2.5px solid var(--border);border-top-color:var(--dark);border-radius:50%;animation:sa-rot .7s linear infinite;vertical-align:middle;margin-right:9px;}
.sa-spin-sm{width:12px;height:12px;border-width:2px;margin-right:7px;border-top-color:var(--dark);}
#sa-refresh[disabled]{opacity:.7;cursor:default;}
@keyframes sa-rot{to{transform:rotate(360deg);}}
.sa-error{color:var(--red);}
.sa-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px;}
.sa-charttype{display:flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:9px;padding:3px;}
.sa-charttype button{border:none;background:transparent;color:#6b6258;font-size:12px;font-weight:600;padding:6px 11px;border-radius:6px;cursor:pointer;}
.sa-charttype button.on{background:var(--dark);color:#fff;}
.sa-tile{background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px 15px 13px;}
.sa-tile .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#a0968a;margin-bottom:7px;}
.sa-tile .val{font-family:var(--title-font);font-size:25px;line-height:1;color:var(--dark);}
.sa-tile .sub{font-size:10.5px;color:#b3a99c;margin-top:5px;height:12px;}
.sa-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px;}
.sa-chart-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;}
.sa-metricsel{display:flex;gap:4px;flex-wrap:wrap;}
.sa-metricsel button{border:1px solid var(--border);background:#fff;color:#6b6258;font-size:12px;font-weight:600;padding:6px 11px;border-radius:7px;cursor:pointer;}
.sa-metricsel button.on{background:var(--dark);color:#fff;border-color:var(--dark);}
.sa-toggles{display:flex;gap:12px;flex-wrap:wrap;}
.sa-toggles label{display:flex;align-items:center;gap:5px;font-size:12.5px;color:#5a5249;cursor:pointer;user-select:none;}
.sa-toggles .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.sa-chart-cap{font-size:11px;color:#b3a99c;margin:0 0 10px;}
.sa-chart-wrap{position:relative;height:300px;}
.sa-table{width:100%;border-collapse:collapse;font-size:13px;}
.sa-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#a0968a;font-weight:700;padding:6px 10px;border-bottom:1px solid var(--border);}
.sa-table td{padding:9px 10px;border-bottom:1px solid #f0ebe1;}
.sa-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
.sa-table tr:last-child td{border-bottom:none;}
.sa-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.sa-ch{display:flex;align-items:center;gap:8px;font-weight:600;}
.sa-ch .dot{width:9px;height:9px;border-radius:50%;}
.sa-pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
.sa-pill.live{background:rgba(39,174,96,.13);color:#1e8c4f;}
.sa-pill.warn{background:rgba(255,184,0,.18);color:#8a6d1f;}
.sa-pill.na{background:#f0ebe1;color:#a0968a;}
.sa-note{font-size:12px;color:#a0968a;margin-top:12px;line-height:1.5;}
.sa-note b{color:#8a6d1f;font-weight:700;}
.sa-ch.clk{cursor:pointer;}
.sa-ch.clk:hover{text-decoration:underline;}
.sa-modal{position:fixed;inset:0;background:rgba(30,27,27,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.sa-modal-card{background:#fff;border-radius:12px;max-width:780px;width:100%;max-height:82vh;overflow:auto;box-shadow:0 8px 40px rgba(0,0,0,.25);}
.sa-modal-head{position:sticky;top:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--border);}
.sa-modal-head h3{font-family:var(--title-font);font-size:18px;margin:0;}
#sa-modal-close{border:none;background:transparent;font-size:24px;line-height:1;color:#a0968a;cursor:pointer;padding:0 4px;}
.sa-ptable{width:100%;border-collapse:collapse;font-size:13px;}
.sa-ptable th{text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#a0968a;font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border);}
.sa-ptable th.l{text-align:left;}
.sa-ptable td{padding:10px 14px;border-bottom:1px solid #f3eee4;vertical-align:top;}
.sa-ptable td.num{text-align:right;font-variant-numeric:tabular-nums;}
.sa-ptable .ptxt{max-width:380px;}
.sa-ptable .ptxt a{color:var(--dark);text-decoration:none;}
.sa-ptable .ptxt a:hover{text-decoration:underline;}
.sa-ptable .pdate{font-size:11px;color:#b3a99c;margin-top:3px;}
@media(max-width:768px){html,body{overflow-x:hidden;}.admin-header{flex-direction:column;align-items:stretch;gap:10px;padding:12px 16px;}.admin-header-left{flex-direction:column;align-items:stretch;gap:8px;}.admin-header h1{font-size:17px;}.admin-nav{flex-wrap:wrap;overflow:visible;row-gap:4px;}.admin-nav a{white-space:nowrap;}.admin-header .user-info{width:100%;justify-content:space-between;}.admin-subnav{padding:0 12px;}.sa-tiles{grid-template-columns:repeat(3,1fr);}.sa-table{font-size:12px;min-width:520px;}.sa-ptable{min-width:480px;}.sa-table .hide-sm{display:none;}}
</style>

@media(min-width:769px){

  .admin-nav{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:flex; gap:6px; flex-wrap:nowrap; width:auto;
  }
  .admin-subnav{ justify-content:center; }
  /* desktop: right-align the numeric column HEADERS so each sits directly above its right-aligned numbers */

<body>

<script>
(function(){
  'use strict';
  var SUPABASE_URL='https://scawgrjcjgcmvsimvash.supabase.co';
  var SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjYXdncmpjamdjbXZzaW12YXNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3NzAxMDIsImV4cCI6MjA4ODM0NjEwMn0.lmks8ntJPZ0giQEpuH3tSSBllzmOj20oUrb96kBIdh0';
  var sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
  var $ls=document.getElementById('login-screen'),$app=document.getElementById('admin-app');
  var $em=document.getElementById('login-email'),$pw=document.getElementById('login-pass');
  var $bt=document.getElementById('login-btn'),$er=document.getElementById('login-error');
  var $out=document.getElementById('logout-btn'),$ue=document.getElementById('user-email');
  var started=false;
  function showAdmin(u){ $ls.style.display='none'; $app.style.display='block'; $ue.textContent=(u&&u.email)||''; if(!started){ started=true; SA.init(); } }
  async function checkSession(){ var s=await sb.auth.getSession(); if(s.data&&s.data.session) showAdmin(s.data.session.user); }
  $bt.addEventListener('click', async function(){ $er.style.display='none'; var e=$em.value.trim(),p=$pw.value; if(!e||!p){ $er.textContent='Enter email and password'; $er.style.display='block'; return; } $bt.textContent='Signing in...'; $bt.disabled=true; var r=await sb.auth.signInWithPassword({email:e,password:p}); $bt.textContent='Sign In'; $bt.disabled=false; if(r.error){ $er.textContent=r.error.message; $er.style.display='block'; return; } showAdmin(r.data.user); });
  $pw.addEventListener('keydown', function(ev){ if(ev.key==='Enter') $bt.click(); });
  $out.addEventListener('click', async function(){ await sb.auth.signOut(); location.reload(); });

  // ---------------- analytics dashboard ----------------
  var CH=[['facebook','Facebook','#1877f2'],['instagram','Instagram','#d6336c'],['threads','Threads','#111111'],['bluesky','Bluesky','#06b6d4'],['x','X','#1a8f7a'],['substack','Substack','#FF6719']];
  var METRICS=[['views','Views'],['reactions','Reactions / Likes'],['comments','Comments / Replies'],['shares','Shares / Reposts']];
  var WINDOWS=[1,3,7,14,30,45,60,90];
  var SA={ raw:null, win:30, custom:null, metric:'views', chartType:'line', on:{facebook:true,instagram:true,threads:true,bluesky:true,x:true,substack:true}, chart:null };
  var $=function(id){return document.getElementById(id);};
  function fmt(n){ n=Math.round(n||0); if(n>=1000000) return (n/1000000).toFixed(1)+'M'; if(n>=1000) return (n/1000).toFixed(n>=10000?0:1)+'k'; return String(n); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  SA.init=function(){

    WINDOWS.forEach(function(d){ html+='<button data-w="'+d+'">'+d+'d</button>'; });

    w.innerHTML=html;
    w.querySelectorAll('button').forEach(function(b){ b.onclick=function(){
      if(b.dataset.w==='custom'){ $('sa-custom').style.display='flex'; SA.applyCustomIfReady(); }
      else { SA.custom=null; SA.win=parseInt(b.dataset.w,10); $('sa-custom').style.display='none'; SA.paintControls(); SA.load(false); }
    };});
    $('sa-from').onchange=$('sa-to').onchange=SA.applyCustomIfReady;
    var ct=$('sa-charttype'); if(ct){ ct.innerHTML='<button data-t="line">Line</button><button data-t="bar">Bar</button>'; ct.querySelectorAll('button').forEach(function(b){ b.onclick=function(){ SA.chartType=b.dataset.t; SA.paintControls(); SA.renderChart(); };}); }

    var t=$('sa-toggles'), th='';
    CH.forEach(function(c){ th+='<label><input type="checkbox" data-c="'+c[0]+'" checked><span class="dot" style="background:'+c[2]+'"></span>'+c[1]+'</label>'; });
    t.innerHTML=th;
    t.querySelectorAll('input').forEach(function(cb){ cb.onchange=function(){ SA.on[cb.dataset.c]=cb.checked; SA.render(); };});
    $('sa-refresh').onclick=function(){ SA.refresh(); };
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') SA.backToDashboard(); });
    SA.paintControls();
    SA.load(false);
  };
  SA.backToDashboard=function(){
    var pv=$('sa-posts-view'); if(!pv||pv.style.display==='none') return;
    pv.style.display='none'; pv.innerHTML='';
    var ctrl=document.querySelector('.sa-controls'); if(ctrl) ctrl.style.display='flex';
    if(SA.raw){ $('sa-body').style.display='block'; SA.render(); }
    try{ if(String(location.hash).indexOf('posts/')>=0) history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  };
  SA.openPosts=async function(channel, dateFilter){
    var nm=((CH.filter(function(c){return c[0]===channel;})[0])||['','?'])[1];
    var ctrl=document.querySelector('.sa-controls'); if(ctrl) ctrl.style.display='none';
    $('sa-body').style.display='none';
    var pv=$('sa-posts-view'); pv.style.display='block';
    var heading=esc(nm)+' &mdash; '+(dateFilter?('posts on '+esc(dateFilter)):'your posts');
    var sub=dateFilter?('Everything you posted to '+esc(nm)+' on '+esc(dateFilter)+', with its results.'):('Ranked by performance, '+(SA.custom?'custom range':'last '+SA.win+' days')+'. Click a post to open it.');
    pv.innerHTML='<button class="btn btn-sm" id="sa-back" style="background:var(--bg-alt);border:1px solid var(--border)">&larr; Back to analytics</button>'
      +'<h3 style="font-family:var(--title-font);font-size:21px;margin:16px 0 2px">'+heading+'</h3>'
      +'<p class="section-sub" style="margin-bottom:16px">'+sub+'</p>'
      +'<div class="sa-card" style="padding:0"><div id="sa-posts-body"><div style="padding:44px;text-align:center;color:#8a8178">Loading your posts&hellip;</div></div></div>';
    $('sa-back').onclick=SA.backToDashboard;
    try{ history.replaceState(null,'',location.pathname+location.search+'#posts/'+channel+(dateFilter?('/'+dateFilter):'')); }catch(e){}
    try{
      var r=await sb.functions.invoke('social-analytics',{body:{action:'posts',channel:channel,window_days:SA.win}});
      if(r.error) throw r.error;
      var posts=(r.data&&r.data.posts)||[];
      if(dateFilter) posts=posts.filter(function(p){ return p.date===dateFilter; });
      var bodyEl=$('sa-posts-body');
      if(!posts.length){ bodyEl.innerHTML='<div style="padding:44px;text-align:center;color:#8a8178">No '+esc(nm)+' posts '+(dateFilter?('on '+esc(dateFilter)):'found in this window')+'.</div>'; return; }
      var noViews=(channel==='bluesky');
      var h='<div class="sa-scroll"><table class="sa-ptable"><tr><th class="l">Post</th>'+(noViews?'':'<th>Views</th>')+'<th>Reactions</th><th>Comments</th><th>Shares</th></tr>';
      posts.forEach(function(p){
        var txt=esc(p.text||'Image (no caption)');
        var cell=p.permalink?('<a href="'+esc(p.permalink)+'" target="_blank" rel="noopener">'+txt+'</a>'):txt;
        h+='<tr><td class="ptxt">'+cell+'<div class="pdate">'+esc(p.date)+(p.kind?(' &middot; '+esc(p.kind)):'')+'</div></td>'
          +(noViews?'':'<td class="num">'+(p.views==null?'&mdash;':fmt(p.views))+'</td>')
          +'<td class="num">'+fmt(p.reactions)+'</td><td class="num">'+(p.comments==null?'&mdash;':fmt(p.comments))+'</td><td class="num">'+(p.shares==null?'&mdash;':fmt(p.shares))+'</td></tr>';
      });
      h+='</table></div>';
      if(channel==='facebook') h+='<p style="font-size:11px;color:#b3a99c;padding:12px 14px;margin:0">Facebook per-post views use Meta\'s new <b>media views</b> metric, which only counts photo, video and reel posts. Link-only posts show &mdash; (Meta has no per-post number for them). The dashboard\'s Facebook Views tile counts all impressions page-wide, so it\'s larger than these per-post views add up to.</p>';
      bodyEl.innerHTML=h;
    }catch(e){ var be=$('sa-posts-body'); if(be) be.innerHTML='<div style="padding:44px;text-align:center;color:var(--red)">Could not load: '+esc((e&&e.message)||e)+'</div>'; }
  };

  SA.openPostsAllForDate=async function(dateFilter){
    var chans=CH.filter(function(c){ return SA.on[c[0]]; });
    var ctrl=document.querySelector('.sa-controls'); if(ctrl) ctrl.style.display='none';
    $('sa-body').style.display='none';
    var pv=$('sa-posts-view'); pv.style.display='block';
    var heading='All channels &mdash; posts on '+esc(dateFilter);
    var sub='Everything you posted on '+esc(dateFilter)+' across your selected channels, with each post’s results.';
    pv.innerHTML='<button class="btn btn-sm" id="sa-back" style="background:var(--bg-alt);border:1px solid var(--border)">&larr; Back to analytics</button>'
      +'<h3 style="font-family:var(--title-font);font-size:21px;margin:16px 0 2px">'+heading+'</h3>'
      +'<p class="section-sub" style="margin-bottom:16px">'+sub+'</p>'
      +'<div id="sa-posts-multi"><div style="padding:44px;text-align:center;color:#8a8178">Loading your posts&hellip;</div></div>';
    $('sa-back').onclick=SA.backToDashboard;
    try{ history.replaceState(null,'',location.pathname+location.search+'#postsday/'+dateFilter); }catch(e){}
    try{
      var results=await Promise.all(chans.map(function(c){
        return sb.functions.invoke('social-analytics',{body:{action:'posts',channel:c[0],window_days:SA.win}})
          .then(function(r){ return {c:c, posts:(!r.error&&r.data&&r.data.posts)||[]}; })
          .catch(function(){ return {c:c, posts:[]}; });
      }));
      var html=''; var any=false;
      results.forEach(function(res){
        var dayPosts=res.posts.filter(function(p){ return p.date===dateFilter; });
        if(!dayPosts.length) return;
        any=true;
        var channel=res.c[0], nm=res.c[1], color=res.c[2], noViews=(channel==='bluesky');
        html+='<div class="sa-card" style="padding:0;margin-bottom:16px">'
          +'<div style="display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)"><span style="width:10px;height:10px;border-radius:50%;background:'+color+';display:inline-block"></span><b style="font-family:var(--title-font);font-size:15px">'+esc(nm)+'</b><span style="color:#8a8178;font-size:12px">'+dayPosts.length+' post'+(dayPosts.length>1?'s':'')+'</span></div>'
          +'<div class="sa-scroll"><table class="sa-ptable"><tr><th class="l">Post</th>'+(noViews?'':'<th>Views</th>')+'<th>Reactions</th><th>Comments</th><th>Shares</th></tr>';
        dayPosts.forEach(function(p){
          var txt=esc(p.text||'Image (no caption)');
          var cell=p.permalink?('<a href="'+esc(p.permalink)+'" target="_blank" rel="noopener">'+txt+'</a>'):txt;
          html+='<tr><td class="ptxt">'+cell+'<div class="pdate">'+esc(p.date)+(p.kind?(' &middot; '+esc(p.kind)):'')+'</div></td>'
            +(noViews?'':'<td class="num">'+(p.views==null?'&mdash;':fmt(p.views))+'</td>')
            +'<td class="num">'+fmt(p.reactions)+'</td><td class="num">'+(p.comments==null?'&mdash;':fmt(p.comments))+'</td><td class="num">'+(p.shares==null?'&mdash;':fmt(p.shares))+'</td></tr>';
        });
        html+='</table></div></div>';
      });
      var body=$('sa-posts-multi');
      if(!any){ body.innerHTML='<div class="sa-card" style="padding:44px;text-align:center;color:#8a8178">No posts on '+esc(dateFilter)+' for the channels you have selected.</div>'; return; }
      body.innerHTML=html;
    }catch(e){ var be=$('sa-posts-multi'); if(be) be.innerHTML='<div class="sa-card" style="padding:44px;text-align:center;color:var(--red)">Could not load: '+esc((e&&e.message)||e)+'</div>'; }
  };

  SA.applyCustomIfReady=function(){
    var f=$('sa-from').value, t=$('sa-to').value;
    if(f&&t&&f<=t){ SA.custom={from:f,to:t}; var days=Math.max(1,Math.round((new Date(t)-new Date(f))/864e5)+1); SA.win=days; SA.paintControls(); SA.load(false); }
  };

  SA.paintControls=function(){
    document.querySelectorAll('#sa-windows button').forEach(function(b){
      var on=(b.dataset.w==='custom')?!!SA.custom:(!SA.custom&&parseInt(b.dataset.w,10)===SA.win);
      b.classList.toggle('on',on);
    });
    document.querySelectorAll('#sa-metricsel button').forEach(function(b){ b.classList.toggle('on',b.dataset.m===SA.metric); });
    document.querySelectorAll('#sa-charttype button').forEach(function(b){ b.classList.toggle('on',b.dataset.t===SA.chartType); });
  };

  SA.load=async function(refresh){
    $('sa-loading').style.display='block'; $('sa-loading').innerHTML='<span class="sa-spin"></span>'+(refresh?'Refreshing live metrics (this can take a moment)…':'Loading metrics…');
    $('sa-error').style.display='none'; $('sa-body').style.display='none';
    try{
      var r=await sb.functions.invoke('social-analytics',{body:{action:'summary',window_days:SA.win,refresh:!!refresh}});
      if(r.error) throw r.error;
      if(!r.data||!r.data.ok) throw new Error((r.data&&r.data.error)||'No data');
      SA.raw=r.data;
      $('sa-loading').style.display='none'; $('sa-body').style.display='block';
      var when=new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
      $('sa-updated').textContent='Updated '+when+'.';
      SA.render();
    }catch(e){
      $('sa-loading').style.display='none';
      $('sa-error').style.display='block';
      $('sa-error').textContent='Could not load analytics: '+((e&&e.message)||e);
    }
  };

  // Refresh: kick the live pull off in the BACKGROUND (server-side), keep the panes visible, show a small
  // spinner on the button, and poll the cache until the new numbers land. Safe to navigate away mid-refresh.
  SA.refresh=async function(){
    var btn=$('sa-refresh');
    if(btn.dataset.busy==='1') return;
    btn.dataset.busy='1'; btn.disabled=true;
    var orig=btn.innerHTML; btn.innerHTML='<span class="sa-spin sa-spin-sm"></span>Refreshing…';
    var before=(SA.raw&&SA.raw.captured_at)||'';
    function finish(msg){ btn.disabled=false; btn.dataset.busy=''; btn.innerHTML=orig; if(msg)$('sa-updated').textContent=msg; }
    try{ var k=await sb.functions.invoke('social-analytics',{body:{action:'refresh_async'}}); if(k&&k.error) throw k.error; }
    catch(_e){ /* the trigger returns instantly; even if it hiccups the work runs server-side, so just poll */ }
    var tries=0, MAX=45; // ~3 minutes, then stop politely
    (function poll(){
      tries++;
      sb.functions.invoke('social-analytics',{body:{action:'summary',window_days:SA.win,refresh:false}}).then(function(r){
        var d=r&&r.data;
        if(d&&d.ok&&d.captured_at&&d.captured_at!==before){
          SA.raw=d;
          var when=new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
          SA.render();
          finish('Updated '+when+'.');
          return;
        }
        if(tries>=MAX){ finish('Still finishing in the background; the numbers will be ready on your next visit.'); return; }
        setTimeout(poll,4000);
      }).catch(function(){ if(tries>=MAX) finish(); else setTimeout(poll,4000); });
    })();
  };

  SA.seriesDays=function(){
    var rows=(SA.raw&&SA.raw.series)||[];
    if(SA.custom) return rows.filter(function(d){ return d.date>=SA.custom.from && d.date<=SA.custom.to; });
    return rows;
  };

  SA.grand=function(){
    var g={views:0,reach:0,reactions:0,comments:0,shares:0,posts:0};
    var tot=(SA.raw&&SA.raw.totals)||{};
    CH.forEach(function(c){ if(SA.on[c[0]]&&tot[c[0]]){ Object.keys(g).forEach(function(k){ g[k]+=(tot[c[0]][k]||0); }); } });
    return g;
  };

  SA.render=function(){ if(!SA.raw) return; SA.renderTiles(); SA.renderChart(); SA.renderTable(); };

  SA.renderTiles=function(){
    var g=SA.grand();
    var defs=[['posts','Posts',''],['views','Views',''],['reactions','Reactions / Likes',''],['comments','Comments / Replies',''],['shares','Shares / Reposts','']];
    var html='';
    defs.forEach(function(d){ html+='<div class="sa-tile"><div class="lbl">'+d[1]+'</div><div class="val">'+fmt(g[d[0]])+'</div><div class="sub">&nbsp;</div></div>'; });
    $('sa-tiles').innerHTML=html;
  };

  SA.renderChart=function(){
    var tot=(SA.raw&&SA.raw.totals)||{};
    var mlabel=((METRICS.filter(function(x){return x[0]===SA.metric;})[0])||['',''])[1];
    var yticks={precision:0,callback:function(v){return fmt(v);}};
    if(SA.chart) SA.chart.destroy();
    var ctx=$('sa-chart').getContext('2d');
    var rows=SA.seriesDays();
    if(SA.chartType==='bar' || !rows.length){
      var labels=[],data=[],colors=[],bkeys=[];
      CH.forEach(function(c){ if(!SA.on[c[0]]) return; labels.push(c[1]); bkeys.push(c[0]); data.push((tot[c[0]]&&tot[c[0]][SA.metric])||0); colors.push(c[2]); });
      SA.chart=new Chart(ctx,{type:'bar',data:{labels:labels,datasets:[{label:mlabel,data:data,backgroundColor:colors,borderRadius:6,maxBarThickness:96}]},options:{
        responsive:true,maintainAspectRatio:false,
        onHover:function(e,els){ if(e.native&&e.native.target) e.native.target.style.cursor=(els&&els.length)?'pointer':'default'; },
        onClick:function(e,els){ if(els&&els.length){ var k=bkeys[els[0].index]; if(k) SA.openPosts(k); } },
        plugins:{legend:{display:false},tooltip:{callbacks:{label:function(it){return mlabel+': '+fmt(it.parsed.y)+' — click for posts';}}}},
        scales:{y:{beginAtZero:true,ticks:yticks,grid:{color:'#f0ebe1'}},x:{grid:{display:false}}}
      }});
      return;
    }
    // line: REAL per-day data only (no flat averages); channels without daily data for this metric are simply not plotted
    var n=rows.length, lineDs=[];
    if(n){ CH.forEach(function(c){ if(!SA.on[c[0]]) return; var k=c[0];
      var daily=rows.map(function(d){ return (d[k]&&d[k][SA.metric])||0; });
      var est=(k==='instagram'&&SA.metric==='views');
      if(!daily.some(function(v){return v>0;})){
        // no real per-day data for this metric (e.g. IG/Threads engagement) -> estimate by spreading
        // the window total across the channel's daily-views shape, so it sums to the real total
        var total=(tot[k]&&tot[k][SA.metric])||0; if(total<=0) return;
        var shape=rows.map(function(d){ return (d[k]&&d[k].views)||0; });
        var ssum=shape.reduce(function(a,b){return a+b;},0);
        daily = ssum>0 ? shape.map(function(v){ return total*v/ssum; }) : rows.map(function(){ return total/n; });
        est=true;
      }
      lineDs.push({label:c[1],chKey:k,data:daily,borderColor:c[2],backgroundColor:c[2],tension:0.35,pointRadius:(n<=3?3:0),pointHitRadius:14,borderWidth:2,fill:false});
    }); }
    if(lineDs.length){
      var fullDates=rows.map(function(d){ return d.date; });
      var labels=rows.map(function(d){ return d.date.slice(5); });
      SA.chart=new Chart(ctx,{type:'line',data:{labels:labels,datasets:lineDs},options:{
        responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        onHover:function(e,els){ if(e.native&&e.native.target) e.native.target.style.cursor=(els&&els.length)?'pointer':'default'; },
        onClick:function(e){ var pts=SA.chart.getElementsAtEventForMode(e,'nearest',{intersect:false},true); if(!pts.length) return; var dt=fullDates[pts[0].index]; if(dt) SA.openPostsAllForDate(dt); },
        plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,font:{size:11}}},tooltip:{callbacks:{title:function(it){return it[0]?it[0].label+' — click to see posts':'';},label:function(it){return it.dataset.label+': '+fmt(it.parsed.y);}}}},
        scales:{y:{beginAtZero:true,ticks:yticks,grid:{color:'#f0ebe1'}},x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12}}}
      }});
      return;
    }
    // no daily data for this metric -> fall back to the per-channel bar so it's never empty
    var blabels=[],bdata=[],bcolors=[];
    CH.forEach(function(c){ if(!SA.on[c[0]]) return; blabels.push(c[1]); bdata.push((tot[c[0]]&&tot[c[0]][SA.metric])||0); bcolors.push(c[2]); });
    SA.chart=new Chart(ctx,{type:'bar',data:{labels:blabels,datasets:[{label:mlabel,data:bdata,backgroundColor:bcolors,borderRadius:6,maxBarThickness:96}]},options:{
      responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(it){return mlabel+': '+fmt(it.parsed.y);}}}},
      scales:{y:{beginAtZero:true,ticks:yticks,grid:{color:'#f0ebe1'}},x:{grid:{display:false}}}
    }});
  };

  SA.renderTable=function(){
    var tot=(SA.raw&&SA.raw.totals)||{}, av=(SA.raw&&SA.raw.availability)||{};
    var html='<tr><th>Channel</th><th class="num">Posts</th><th class="num">Views</th><th class="num">Reactions</th><th class="num">Comments</th><th class="num">Shares</th><th>Status</th></tr>';
    CH.forEach(function(c){
      var k=c[0], p=tot[k]||{views:0,reach:0,reactions:0,comments:0,shares:0,posts:0};
      var st=av[k]||'ok', label='Live', cls='live';
      if(st==='needs_insights'){ label='Reconnect for insights'; cls='warn'; }
      else if(st==='views_need_insights'){ label='Views need reconnect'; cls='warn'; }
      else if(st==='no_token'){ label='Not connected'; cls='na'; }
      var noViews=(k==='bluesky');
      html+='<tr><td><span class="sa-ch clk" data-ch="'+k+'" title="See your '+c[1]+' posts"><span class="dot" style="background:'+c[2]+'"></span>'+c[1]+'</span></td>'
        +'<td class="num">'+(p.posts||0)+'</td>'
        +'<td class="num">'+(noViews?'&mdash;':fmt(p.views))+'</td>'
        +'<td class="num">'+fmt(p.reactions)+'</td>'
        +'<td class="num">'+fmt(p.comments)+'</td>'
        +'<td class="num">'+fmt(p.shares)+'</td>'
        +'<td><span class="sa-pill '+cls+'">'+label+'</span></td></tr>';
    });
    $('sa-table').innerHTML=html;
    document.querySelectorAll('#sa-table .sa-ch.clk').forEach(function(el){ el.onclick=function(){ SA.openPosts(el.dataset.ch); }; });
  };

  checkSession();
})();
</script>
</body>
